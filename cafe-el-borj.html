<style>

  body { margin:0; font-family:"Amiri","Segoe UI",Tahoma,serif; font-size:1.15rem; color:var(--ink); background:var(--paper); line-height:1.7; }
  header { background:var(--sky); color:var(--navy); padding:32px 20px 60px; text-align:center; }
  header h1 { margin:0; font-size:3rem; }
  header small { display:block; letter-spacing:3px; }
  header p { margin:14px auto 26px; max-width:30ch; font-size:1.15rem; }
  .lang { display:flex; justify-content:center; gap:8px; margin-bottom:28px; }
  .lang button { font:inherit; font-size:.95rem; border:2px solid var(--navy); background:transparent; color:var(--navy); padding:4px 14px; border-radius:999px; cursor:pointer; }
  .lang button.on { background:var(--navy); color:#fff; }
  .cover { display:block; width:100%; max-width:560px; height:220px; object-fit:cover; border-radius:16px; margin:0 auto 20px; }
  .cover[hidden] { display:none; }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:560px; margin:0 auto 24px; }
  .chips span { background:#fff; color:var(--navy); padding:6px 14px; border-radius:999px; font-size:.95rem; font-weight:600; }
  .btn { display:inline-block; background:var(--navy); color:#fff; padding:12px 28px; border-radius:999px; text-decoration:none; font-weight:700; }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .btn.ghost { background:transparent; color:var(--navy); border:2px solid var(--navy); }
  .btn[hidden] { display:none; }
  .social { display:flex; justify-content:center; gap:20px; margin-top:20px; }
  .social a { color:var(--navy); font-weight:700; text-decoration:underline; text-underline-offset:5px; }
  html { scroll-behavior:smooth; }
  .nav { position:sticky; top:0; z-index:5; display:flex; gap:8px; overflow-x:auto; padding:10px 16px; background:var(--paper); border-bottom:1px solid #d6e2ee; }
  .nav a { flex:none; color:var(--navy); text-decoration:none; font-weight:700; font-size:.95rem; padding:4px 14px; border:2px solid var(--navy); border-radius:999px; white-space:nowrap; }
  section { scroll-margin-top:64px; }
  main { max-width:640px; margin:0 auto; padding:16px 20px 48px; }
  h2 { color:var(--navy); font-size:1.5rem; margin:40px 0 12px; padding-inline-start:12px; border-inline-start:5px solid var(--sun); }
  .sec { display:block; width:100%; max-width:280px; height:170px; object-fit:cover; border-radius:14px; margin:0 0 8px; }
  .item { display:flex; align-items:center; gap:12px; padding:8px 0; }
  .thumb { width:64px; height:64px; flex:none; border-radius:12px; background:var(--sky); overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .item i { flex:1; border-bottom:2px dotted #b4c6d8; }
  .item b { color:var(--navy); white-space:nowrap; }
  .info { background:var(--sky); border-radius:12px; padding:20px 24px; margin-top:40px; }
  .info p { margin:6px 0; }
  footer { text-align:center; padding:24px; font-size:.85rem; color:#6b7c8a; }
</style>

const illUri = n => "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170">' + BG + ILL[n] + "</svg>");

rs.setProperty("--navy", C.colors.main);
rs.setProperty("--sky", C.colors.soft);
rs.setProperty("--sun", C.colors.accent);
$("latin").textContent = C.latin;
$("book").href = "https://wa.me/" + C.whatsapp;
if (C.map) { $("mapbtn").href = C.map; $("mapbtn").hidden = false; }
$("social").innerHTML = [["Instagram", C.instagram], ["Facebook", C.facebook]]
  .filter(x => x[1]).map(([n, u]) => '<a href="' + u + '" target="_blank" rel="noopener">' + n + "</a>").join("");
$("lang").innerHTML = [["ar", "العربية"], ["fr", "Français"], ["en", "English"]]
  .map(([l, n]) => '<button data-l="' + l + '">' + n + "</button>").join("");
$("lang").onclick = e => { const l = e.target.dataset.l; if (l) { LANG = l; render(); } };

// كيقلب على الصورة بأي امتداد
const EXTS = [".svg", ".jpg", ".jpeg", ".png", ".webp", ".jfif", ".avif", ".jpg.jpg", ".jpg.jpeg", ".jpg.png", ".jpg.webp", ".jpg.jfif", ".jpg.avif"];
function loadImg(img, base, ok) {
  let k = 0;
  img.onload = () => ok && ok();
  img.onerror = () => { k++; if (k < EXTS.length) img.src = base + EXTS[k]; else (img.closest(".thumb") || img).remove(); };
  img.src = base + EXTS[0];
}
loadImg($("cover"), "cafe-photo", () => { $("cover").hidden = false; });

function render() {
  const U = UI[LANG], d = document.documentElement;
  d.lang = LANG; d.dir = LANG === "ar" ? "rtl" : "ltr";
  document.title = C.name[LANG];
  $("name").textContent = C.name[LANG];
  $("tagline").textContent = C.tagline[LANG];
  $("footer").textContent = C.footer[LANG];
  $("book").textContent = U.book;
  $("mapbtn").textContent = U.map;
  $("chips").innerHTML = C.services[LANG].map(x => "<span>" + x + "</span>").join("");
  $("info").innerHTML = "<p><b>" + U.hours + ":</b> " + C.hours[LANG] + "</p><p><b>" + U.address + ":</b> " +
    C.address + "</p><p><b>" + U.phone + ":</b> " + C.phone + "</p>";
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  const title = s => { const [a, f, e] = s.t.split("|"); return { ar: a, fr: f, en: e || f }[LANG]; };
  $("menu-nav").setAttribute("aria-label", NAV[LANG]);
  $("menu-nav").innerHTML = C.menu.map((s, i) => '<a href="#cat-' + i + '">' + title(s) + "</a>").join("");
  $("menu").innerHTML = C.menu.map((s, idx) => {
    const banner = s.img ? '<img class="sec" data-base="' + s.img + '" alt="">'
      : ILL[idx + 1] ? '<img class="sec" src="' + illUri(idx + 1) + '" alt="">' : "";
    return '<section id="cat-' + idx + '"><h2>' + title(s) + "</h2>" + banner + s.i.map(row => {
      const [fr, ar, en, p, img] = row.split("|"), name = { fr: fr, ar: ar || fr, en: en || fr }[LANG];
      return '<div class="item">' + (img ? '<div class="thumb"><img data-base="' + img + '" alt="' + name + '"></div>' : "") +
        "<span>" + name + "</span><i></i><b>" + p + " " + U.dh + "</b></div>";
    }).join("") + "</section>";
  }).join("");
  document.querySelectorAll("img[data-base]").forEach(im => loadImg(im, im.dataset.base));
}
render();
</script>
