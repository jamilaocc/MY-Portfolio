<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- خلي هاد السطر ما دام الموقع مجرد نموذج -->
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<title>EL BORJ</title>

<style>
:root {
  --navy: #16324f;
  --sky: #cfe3f5;
  --sun: #f2a65a;
  --ink: #1b2b3a;
  --paper: #fafcff;
  --nav-height: 90px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: "Amiri", "Segoe UI", Tahoma, serif;
  font-size: 1.15rem;
  color: var(--ink);
  background: var(--paper);
  line-height: 1.7;
}

[hidden] {
  display: none !important;
}

header {
  background: var(--sky);
  color: var(--navy);
  padding: 32px 20px 45px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 3rem;
}

header small {
  display: block;
  letter-spacing: 3px;
}

header p {
  margin: 14px auto 26px;
  max-width: 32ch;
}

.lang {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}

.lang button {
  font: inherit;
  font-size: .95rem;
  border: 2px solid var(--navy);
  background: transparent;
  color: var(--navy);
  padding: 4px 14px;
  border-radius: 999px;
  cursor: pointer;
}

.lang button.on {
  background: var(--navy);
  color: #fff;
}

.cover {
  display: block;
  width: 100%;
  max-width: 560px;
  height: 240px;
  object-fit: cover;
  border-radius: 18px;
  margin: 0 auto 22px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  max-width: 560px;
  margin: 0 auto 24px;
}

.chips span {
  background: #fff;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: .95rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.btn {
  display: inline-block;
  background: var(--navy);
  color: #fff;
  padding: 12px 28px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 700;
  border: 2px solid var(--navy);
}

.btn.ghost {
  background: transparent;
  color: var(--navy);
}

.social {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 20px;
}

.social a {
  color: var(--navy);
  font-weight: 700;
  text-underline-offset: 5px;
}

.menu-nav-wrapper {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid #dce5ee;
  box-shadow: 0 4px 12px rgba(22, 50, 79, .06);
}
