<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b32">
  <title>Café El Borj | مقهى البرج</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --green: #173b32;
      --gold: #d4ad63;
      --background: #f7f4ed;
      --text: #23352f;
      --muted: #737b75;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 42px 18px 30px;
      text-align: center;
      background: var(--green);
      color: white;
    }

    .logo {
      display: inline-grid;
      place-items: center;
      width: 70px;
      height: 70px;
      margin-bottom: 10px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      font-size: 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 42px);
    }

    header p {
      margin: 7px 0 0;
      color: #e5d4b3;
    }

    .tools {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 13px 0;
      background: #f7f4ed;
      border-bottom: 1px solid #deded2;
    }

    .container {
      width: min(1100px, 92%);
      margin-inline: auto;
    }

    #search {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #d8dacd;
      border-radius: 12px;
      background: white;
      color: var(--text);
      font: inherit;
    }

    #search:focus {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 2px 3px;
    }

    nav button {
      flex-shrink: 0;
      padding: 9px 16px;
      border: 1px solid #d8dacd;
      border-radius: 24px;
      background: white;
      color: var(--green);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
    }

    nav button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    main {
      min-height: 45vh;
      padding-block: 22px 45px;
    }

    .section-title {
      margin: 14px 0 18px;
      padding-right: 12px;
      border-right: 4px solid var(--gold);
      font-size: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
      margin-bottom: 30px;
    }

    .card {
      overflow: hidden;
      border: 1px solid #e6e5dc;
      border-radius: 16px;
      background: white;
      box-shadow: 0 4px 15px #173b3208;
    }

    .photo {
      display: grid;
      place-items: center;
      height: 185px;
      overflow: hidden;
      background: #ebe8dd;
      font-size: 58px;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 16px;
    }

    .card h3 {
      margin: 0;
      font-size: 18px;
    }

    .french {
      margin: 4px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .price {
      margin: 10px 0 0;
      color: var(--green);
      font-weight: bold;
    }

    .empty {
      padding: 35px 15px;
      text-align: center;
      color: var(--muted);
    }

    footer {
      padding: 22px;
      text-align: center;
      background: var(--green);
      color: #e5d4b3;
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .photo {
        height: 135px;
      }

      .card-body {
        padding: 12px;
      }

      .card h3 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo" aria-hidden="true">☕</div>
    <h1>مقهى البرج</h1>
    <p lang="fr">Café El Borj — Menu</p>
  </header>

  <div class="tools">
    <div class="container">
      <input
        id="search"
        type="search"
        placeholder="قلّب على شي حاجة… / Rechercher"
        aria-label="البحث في المينو"
      >
      <nav id="categories" aria-label="أقسام المينو"></nav>
    </div>
  </div>

  <main id="menu" class="container"></main>

  <noscript>
    <p class="empty">فعّلي JavaScript فالمتصفح باش يبان المينو.</p>
  </noscript>

  <footer>Café El Borj · مقهى البرج</footer>

      {

        ]
      },
      {

        icon: "🍕",

          {
            ar: "بيتزا",
            fr: "Pizza",
            price: null,
            image: "menu-17-01"
          }
        ]
      },
      {
        id: "18",
        title: "كسكس",
        icon: "🍲",
        items: [
          {
            ar: "كسكس",
            fr: "Couscous",
            price: null,
            image: "menu-18-01"
          }
        ]
      },
      {
        id: "19",
        title: "حلويات",
        icon: "🍰",
        items: [
          {
            ar: "تيراميسو",
            fr: "Tiramisu",
            price: null,
            image: "menu-19-01"
          }
        ]
      }
    ];

    const menuElement = document.getElementById("menu");
    const categoriesElement = document.getElementById("categories");
    const searchElement = document.getElementById("search");

    let activeCategory = "all";

    function normalize(text) {
      return String(text)
        .toLocaleLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[\u064B-\u065F]/g, "")
        .replace(/[أإآ]/g, "ا")
        .replace(/ى/g, "ي")
        .trim();
    }

    function renderCategories() {
      categoriesElement.replaceChildren();

      const categories = [
        { id: "all", title: "جميع الأقسام" },
        ...MENU
      ];

      categories.forEach(function (category) {
        const button = document.createElement("button");
        const selected = category.id === activeCategory;

        button.type = "button";
        button.textContent = category.title;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));

        button.addEventListener("click", function () {
          activeCategory = category.id;
          renderCategories();
          renderMenu();
        });

        categoriesElement.appendChild(button);
      });
    }

    function makePhoto(item, icon) {
      const box = document.createElement("div");
      box.className = "photo";

      const fallback = document.createElement("span");
      fallback.textContent = icon;
      fallback.setAttribute("aria-hidden", "true");
      box.appendChild(fallback);

      if (!item.image) {
        return box;
      }

      const image = document.createElement("img");
      const extensions = ["jpg", "jpeg", "png", "webp"];
      let extensionIndex = 0;

      image.alt = item.ar;
      image.loading = "lazy";
      image.decoding = "async";

      image.addEventListener("load", function () {
        box.replaceChildren(image);
      });

      image.addEventListener("error", function () {
        extensionIndex += 1;

        if (extensionIndex < extensions.length) {
          image.src = "./" + item.image + "." + extensions[extensionIndex];
        }
      });

      image.src = "./" + item.image + "." + extensions[extensionIndex];

      return box;
    }

    function makeCard(item, icon) {
      const card = document.createElement("article");
      card.className = "card";
      card.appendChild(makePhoto(item, icon));

      const body = document.createElement("div");
      body.className = "card-body";

      const title = document.createElement("h3");
      title.textContent = item.ar;
      body.appendChild(title);

      if (item.fr) {
        const french = document.createElement("p");
        french.className = "french";
        french.lang = "fr";
        french.dir = "ltr";
        french.textContent = item.fr;
        body.appendChild(french);
      }

      if (
        item.price !== null &&
        item.price !== undefined &&
        item.price !== ""
      ) {
        const price = document.createElement("p");
        price.className = "price";
        price.textContent = item.price + " درهم";
        body.appendChild(price);
      }

      card.appendChild(body);
      return card;
    }

    function renderMenu() {
      menuElement.replaceChildren();

      const query = normalize(searchElement.value);
      let count = 0;

      MENU.forEach(function (category) {
        if (
          activeCategory !== "all" &&
          category.id !== activeCategory
        ) {
          return;
        }

        const items = category.items.filter(function (item) {
          const text = [
            category.title,
            item.ar,
            item.fr || ""
          ].join(" ");

          return normalize(text).includes(query);
        });

        if (items.length === 0) {
          return;
        }

        const section = document.createElement("section");
        const heading = document.createElement("h2");

        heading.className = "section-title";
        heading.textContent = category.icon + " " + category.title;
        section.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "grid";

        items.forEach(function (item) {
          grid.appendChild(makeCard(item, category.icon));
          count += 1;
        });

        section.appendChild(grid);
        menuElement.appendChild(section);
      });

      if (count === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "ما لقينا حتى نتيجة لهاد البحث.";
        menuElement.appendChild(message);
      }
    }

    searchElement.addEventListener("input", renderMenu);

    renderCategories();
    renderMenu();
  </script>

</html>
