<title>EL BORJ</title>

<style>
:root {
  --navy: #16324f;
  --sky: #cfe3f5;
  --sun: #f2a65a;
  --ink: #1b2b3a;
  --paper: #fafcff;
  --nav-height: 90px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: "Amiri", "Segoe UI", Tahoma, serif;
  font-size: 1.15rem;
  color: var(--ink);
  background: var(--paper);
  line-height: 1.7;
}

[hidden] {
  display: none !important;
}

header {
  background: var(--sky);
  color: var(--navy);
  padding: 32px 20px 45px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 3rem;
}

header small {
  display: block;
  letter-spacing: 3px;
}

header p {
  margin: 14px auto 26px;
  max-width: 32ch;
}

.lang {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}

.lang button {
  font: inherit;
  font-size: .95rem;
  border: 2px solid var(--navy);
  background: transparent;
  color: var(--navy);
  padding: 4px 14px;
  border-radius: 999px;
  cursor: pointer;
}

.lang button.on {
  background: var(--navy);
  color: #fff;
}

.cover {
  display: block;
  width: 100%;
  max-width: 560px;
  height: 240px;
  object-fit: cover;
  border-radius: 18px;
  margin: 0 auto 22px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  max-width: 560px;
  margin: 0 auto 24px;
}

.chips span {
  background: #fff;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: .95rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.btn {
  display: inline-block;
  background: var(--navy);
  color: #fff;
  padding: 12px 28px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 700;
  border: 2px solid var(--navy);
}

.btn.ghost {
  background: transparent;
  color: var(--navy);
}

.social {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 20px;
}

.social a {
  color: var(--navy);
  font-weight: 700;
  text-underline-offset: 5px;
}

.menu-nav-wrapper {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid #dce5ee;
  box-shadow: 0 4px 12px rgba(22, 50, 79, .06);
}

.menu-nav {
  display: flex;
  gap: 8px;
  max-width: 960px;
  margin: 0 auto;
  padding: 14px 20px;
  overflow-x: auto;
  scrollbar-width: thin;
}

.menu-nav a {
  flex: 0 0 auto;
  padding: 8px 16px;
  border: 1px solid var(--navy);
  border-radius: 999px;
  color: var(--navy);
  background: #fff;
  text-decoration: none;
  font-size: .95rem;
  white-space: nowrap;
}

.menu-nav a:hover,
.menu-nav a:focus-visible {
  background: var(--navy);
  color: #fff;
}

a:focus-visible,
button:focus-visible {
  outline: 3px solid var(--sun);
  outline-offset: 4px;
}

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 20px 48px;
}

h2 {
  color: var(--navy);
  font-size: 1.5rem;
  margin: 40px 0 16px;
  padding-inline-start: 12px;
  border-inline-start: 5px solid var(--sun);
  scroll-margin-top: calc(var(--nav-height) + 16px);
}

.items {
  display: grid;
  gap: 12px;
}

.item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: #fff;
  border: 1px solid #e4ebf2;
  border-radius: 16px;
}

.thumb {
  width: 92px;
  height: 92px;
  flex-shrink: 0;
  overflow: hidden;
  border-radius: 12px;
  background: var(--sky);
}

.thumb img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.item-content {
  flex: 1;
  min-width: 0;
}

.item-name {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.price {
  display: inline-block;
  color: var(--navy);
  background: #edf4fa;
  border-radius: 8px;
  padding: 2px 10px;
  margin-top: 6px;
  font-weight: 700;
}

.photo-note {
  color: #536777;
  font-size: .9rem;
  margin: 20px 0 0;
}

.info {
  background: var(--sky);
  border-radius: 16px;
  padding: 20px 24px;
  margin-top: 40px;
  overflow-wrap: anywhere;
}

.info p {
  margin: 6px 0;
}

.info a {
  color: var(--navy);
}

footer {
  text-align: center;
  padding: 24px;
  font-size: .9rem;
  color: #6b7c8a;
}

noscript p {
  text-align: center;
  padding: 20px;
}

@media (max-width: 420px) {
  header h1 {
    font-size: 2.5rem;
  }

  main {
    padding-inline: 12px;
  }

  .item {
    gap: 10px;
    padding: 10px;
  }

  .thumb {
    width: 74px;
    height: 74px;
  }

  .item-name {
    font-size: 1rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}
</style>
</head>

const rootStyle = document.documentElement.style;

let renderVersion = 0;

  const savedLanguage = localStorage.getItem("el-borj-language");
  if (Object.prototype.hasOwnProperty.call(UI, savedLanguage)) {
    LANG = savedLanguage;
  }
} catch {}

rootStyle.setProperty("--navy", C.colors.main);
rootStyle.setProperty("--sky", C.colors.soft);
rootStyle.setProperty("--sun", C.colors.accent);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function pad(number) {
  return String(number).padStart(2, "0");
}

function imageBase(sectionIndex, itemIndex) {
  return `menu-${pad(sectionIndex + 1)}-${pad(itemIndex + 1)}`;
}

function sectionTitle(section) {
  const [ar, fr, en] = section.t.split("|");
  return {
    ar: ar || fr,
    fr,
    en: en || fr
  }[LANG];
}

function updateNavHeight() {
  const height = $("menu-nav-wrapper").getBoundingClientRect().height;
  rootStyle.setProperty("--nav-height", `${height}px`);
}

/*
  صور المينو: jpg / webp / png / jpeg
  صورة الغلاف: نفس الامتدادات القديمة كذلك
*/
const MENU_EXTS = [".jpg", ".webp", ".png", ".jpeg"];
const COVER_EXTS = [
  ".jpg", ".jpeg", ".png", ".webp", ".jfif", ".avif",
  ".jpg.jpg", ".jpg.jpeg", ".jpg.png", ".jpg.webp",
  ".jpg.jfif", ".jpg.avif"
];

function loadImage(img, base, extensions, onSuccess) {
  let index = 0;

  img.onload = () => {
    img.hidden = false;
    const container = img.closest(".thumb");
    if (container) container.hidden = false;
    if (onSuccess) onSuccess();
  };

  img.onerror = () => {
    index++;

    if (index < extensions.length) {
      img.src = base + extensions[index];
      return;
    }

    img.onload = null;
    img.onerror = null;
    img.removeAttribute("src");
    img.hidden = true;

    const container = img.closest(".thumb");
    if (container) container.hidden = true;
  };

  img.src = base + extensions[index];
}

$("latin").textContent = C.latin;
$("book").href = "https://wa.me/" + C.whatsapp;

if (C.map) {
  $("mapbtn").href = C.map;
  $("mapbtn").hidden = false;
}

$("social").innerHTML = [
  ["Instagram", C.instagram],
  ["Facebook", C.facebook]
]
  .filter(([, url]) => url)
  .map(([name, url]) => `
    <a href="${escapeHTML(url)}"
       target="_blank"
       rel="noopener noreferrer">
      ${escapeHTML(name)}
    </a>
  `)
  .join("");

$("lang").innerHTML = [
  ["ar", "العربية"],
  ["fr", "Français"],
  ["en", "English"]
]
  .map(([language, label]) => `
    <button type="button"
            data-l="${language}"
            lang="${language}"
            aria-pressed="false">
      ${label}
    </button>
  `)
  .join("");

$("lang").addEventListener("click", event => {
  const button = event.target.closest("button[data-l]");
  if (!button) return;

  LANG = button.dataset.l;

  try {
    localStorage.setItem("el-borj-language", LANG);
  } catch {}

  render();
});

loadImage($("cover"), "cafe-photo", COVER_EXTS);

function render() {
  const version = ++renderVersion;
  const U = UI[LANG];

  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.title = C.name[LANG];

  $("name").textContent = C.name[LANG];
  $("tagline").textContent = C.tagline[LANG];
  $("footer").textContent = C.footer[LANG];
  $("book").textContent = U.book;
  $("mapbtn").textContent = U.map;
  $("cover").alt = U.cover;

  $("photo-note").textContent = U.photoNote;
  $("photo-note").hidden = true;

  $("chips").innerHTML = C.services[LANG]
    .map(service => `<span>${escapeHTML(service)}</span>`)
    .join("");

  const phoneHref = String(C.phone).replace(/[^\d+]/g, "");

  $("info").innerHTML = `
    <p>
      <b>${escapeHTML(U.hours)}:</b>
      ${escapeHTML(C.hours[LANG])}
    </p>
    <p>
      <b>${escapeHTML(U.address)}:</b>
      ${escapeHTML(C.address)}
    </p>
    <p>
      <b>${escapeHTML(U.phone)}:</b>
      <a href="tel:${escapeHTML(phoneHref)}">
        <bdi dir="ltr">${escapeHTML(C.phone)}</bdi>
      </a>
    </p>
  `;

  document.querySelectorAll("#lang button").forEach(button => {
    const selected = button.dataset.l === LANG;
    button.classList.toggle("on", selected);
    button.setAttribute("aria-pressed", String(selected));
  });

  $("menu-nav").setAttribute("aria-label", U.categories);

  $("menu-nav").innerHTML = C.menu
    .map((section, sectionIndex) => `
      <a href="#category-${sectionIndex}">
        ${escapeHTML(sectionTitle(section))}
      </a>
    `)
    .join("");

  $("menu").innerHTML = C.menu
    .map((section, sectionIndex) => {
      const items = section.i.map((row, itemIndex) => {
        const [fr, ar, en, price, customImage] = row.split("|");

        const name = {
          fr,
          ar: ar || fr,
          en: en || fr
        }[LANG];

        const base = customImage ||
          imageBase(sectionIndex, itemIndex);

        return `
          <article class="item">
            <div class="thumb" hidden>
              <img
                data-base="${escapeHTML(base)}"
                alt="${escapeHTML(name)}"
                decoding="async"
                width="92"
                height="92">
            </div>

            <div class="item-content">
              <h3 class="item-name">${escapeHTML(name)}</h3>
              <span class="price">
                <bdi dir="ltr">${escapeHTML(price)}</bdi>
                ${escapeHTML(U.dh)}
              </span>
            </div>
          </article>
        `;
      }).join("");

      return `
        <section aria-labelledby="category-${sectionIndex}">
          <h2 id="category-${sectionIndex}">
            ${escapeHTML(sectionTitle(section))}
          </h2>
          <div class="items">${items}</div>
        </section>
      `;
    })
    .join("");

  document.querySelectorAll(".thumb img").forEach(img => {
    loadImage(img, img.dataset.base, MENU_EXTS, () => {
      if (version === renderVersion && C.illustrativePhotos) {
        $("photo-note").hidden = false;
      }
    });
  });

  requestAnimationFrame(updateNavHeight);
}

window.addEventListener("resize", updateNavHeight);

if ("ResizeObserver" in window) {
  const navObserver = new ResizeObserver(updateNavHeight);
  navObserver.observe($("menu-nav-wrapper"));
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(updateNavHeight);
}

render();
</script>
</body>
</html>
