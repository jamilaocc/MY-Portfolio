<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>كافي كلاود</title>
<style>
  :root { --navy:#16324f; --sky:#cfe3f5; --sun:#f2a65a; --ink:#1b2b3a; --paper:#fafcff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif; color:var(--ink); background:var(--paper); line-height:1.6; }
  header { background:var(--sky); color:var(--navy); padding:56px 20px 60px; text-align:center; }
  header svg { width:110px; display:block; margin:0 auto 8px; }
  header h1 { margin:0; font-size:3rem; }
  header small { display:block; letter-spacing:3px; }
  header p { margin:14px auto 26px; max-width:30ch; font-size:1.15rem; }
  .cover { display:block; width:100%; max-width:560px; height:220px; object-fit:cover; border-radius:16px; margin:0 auto 20px; }
  .cover[hidden] { display:none; }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:560px; margin:0 auto 24px; }
  .chips span { background:#fff; color:var(--navy); padding:6px 14px; border-radius:999px; font-size:.95rem; font-weight:600; }
  .btn { display:inline-block; background:var(--navy); color:#fff; padding:12px 28px; border-radius:999px; text-decoration:none; font-weight:700; }
  main { max-width:640px; margin:0 auto; padding:16px 20px 48px; }
  h2 { color:var(--navy); font-size:1.5rem; margin:40px 0 12px; padding-right:12px; border-right:5px solid var(--sun); }
  .item { display:flex; align-items:center; gap:12px; padding:8px 0; }
  .thumb { width:64px; height:64px; flex:none; border-radius:12px; background:var(--sky); overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .item i { flex:1; border-bottom:2px dotted #b4c6d8; }
  .item b { color:var(--navy); white-space:nowrap; }
  .info { background:var(--sky); border-radius:12px; padding:20px 24px; margin-top:40px; }
  .info p { margin:6px 0; }
  footer { text-align:center; padding:24px; font-size:.85rem; color:#6b7c8a; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 80 50" aria-hidden="true"><g fill="#fff"><circle cx="25" cy="32" r="14"/><circle cx="43" cy="22" r="18"/><circle cx="60" cy="32" r="13"/><rect x="25" y="32" width="35" height="14"/></g></svg>
  <h1>CAFFE CLOUD</h1>
  <small>CLOUD CAFÉ</small>
   <p>القهوة التي تحلق بك بعيداً.</p>
  <img id="cover" class="cover" alt="صورة المقهى" hidden>
  <div class="chips" id="chips"></div>
  <a class="btn" href="https://wa.me/212770144817">احجز طاولة</a>
</header>

<main>
  <div id="menu"></div>
  <div class="info">
    <p><b>أوقات العمل:</b> كل يوم من 8:00 صباحا إلى 11:00 ليلا</p>
    <p><b>sefrou:</b> [al alia]</p>
    <p><b>0770144817:</b> [2]</p>
  </div>
</main>

<footer>نموذج موقع من تصميم جميلة</footer>

<script>
  // الخدمات اللي كيقدم المقهى (بدليهم بالخدمات الحقيقية)
  const SERVICES = ["قهوة وأتاي", "فطور", "واي فاي مجاني", "الطلبات للخارج", "جلسة خارجية"];
  document.getElementById("chips").innerHTML = SERVICES.map(x => "<span>" + x + "</span>").join("");

  // صورة المقهى: سميها cafe-photo (بلا امتداد) وارفعها، والكود كيلقاها
  const cover = document.getElementById("cover");
  const exts = [".jpg", ".jpeg", ".png", ".webp", ".jfif", ".avif", ".jpg.jpg", ".jpg.webp", ".jpg.jfif", ".jpg.avif"];
  let k = 0;
  cover.onload = () => { cover.hidden = false; };
  cover.onerror = () => { k++; if (k < exts.length) cover.src = "cafe-photo" + exts[k]; else cover.remove(); };
  cover.src = "cafe-photo" + exts[0];
  // كل مشروب: [السمية، الثمن، سمية الصورة]
  const MENU = [
    { t: "المشروبات الساخنة", i: [
      ["قهوة سوداء", "10 دراهم", "qahwa-kahla.jpg.jpg"],
      ["نص نص", "14 درهم", "nos-nos.jpg.jpg"],
      ["كابتشينو", "20 درهم", "cappuccino.jpg.avif"],
      ["كلاود لاتيه", "25 درهم", "cloud-latte.jpg.jpg"],
      ["أتاي بالنعناع", "12 درهم", "atay.jpg.webp"] ] },
    { t: "المشروبات الباردة", i: [
      ["عصير البرتقال", "15 درهم", "orange.jpg.jpg"],
      ["آيس لاتيه", "24 درهم", "iced-latte.jpg.jpg"],
      ["موهيتو", "22 درهم", "mojito.jpg.jfif"] ] },
    { t: "الحلويات", i: [
      ["كرواسون", "8 دراهم", "croissant.jpg.jfif"],
      ["كيك", "18 درهم", "cake.jpg.jfif"],
      ["بانكيك", "25 درهم", "pancake.jpg.jfif"] ] }
  ];
  document.getElementById("menu").innerHTML = MENU.map(s =>
    "<h2>" + s.t + "</h2>" + s.i.map(([n, p, f]) =>
      '<div class="item"><div class="thumb"><img src="' + f + '" alt="' + n +
      '" loading="lazy" onerror="this.remove()"></div><span>' + n + "</span><i></i><b>" + p + "</b></div>"
    ).join("")
  ).join("");
</script>
</body>
</html>
