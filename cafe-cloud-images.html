<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- حيدي هاد السطر فموقع الزبون الحقيقي باش يبان فـ Google -->
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<title>كافي</title>
<style>
  :root { --navy:#16324f; --sky:#cfe3f5; --sun:#f2a65a; --ink:#1b2b3a; --paper:#fafcff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Amiri","Segoe UI",Tahoma,serif; font-size:1.15rem; color:var(--ink); background:var(--paper); line-height:1.7; }
  header { background:var(--sky); color:var(--navy); padding:56px 20px 60px; text-align:center; }
  header svg { width:110px; display:block; margin:0 auto 8px; }
  header h1 { margin:0; font-size:3rem; }
  header small { display:block; letter-spacing:3px; }
  header p { margin:14px auto 26px; max-width:30ch; font-size:1.15rem; }
  .cover { display:block; width:100%; max-width:560px; height:220px; object-fit:cover; border-radius:16px; margin:0 auto 20px; }
  .cover[hidden] { display:none; }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:560px; margin:0 auto 24px; }
  .chips span { background:#fff; color:var(--navy); padding:6px 14px; border-radius:999px; font-size:.95rem; font-weight:600; }
  .btn { display:inline-block; background:var(--navy); color:#fff; padding:12px 28px; border-radius:999px; text-decoration:none; font-weight:700; }
  main { max-width:640px; margin:0 auto; padding:16px 20px 48px; }
  h2 { color:var(--navy); font-size:1.5rem; margin:40px 0 12px; padding-right:12px; border-right:5px solid var(--sun); }
  .item { display:flex; align-items:center; gap:12px; padding:8px 0; }
  .thumb { width:64px; height:64px; flex:none; border-radius:12px; background:var(--sky); overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .item i { flex:1; border-bottom:2px dotted #b4c6d8; }
  .item b { color:var(--navy); white-space:nowrap; }
  .info { background:var(--sky); border-radius:12px; padding:20px 24px; margin-top:40px; }
  .info p { margin:6px 0; }
  .info a { color:var(--navy); font-weight:700; }
  footer { text-align:center; padding:24px; font-size:.85rem; color:#6b7c8a; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 80 50" aria-hidden="true"><g fill="#fff"><circle cx="25" cy="32" r="14"/><circle cx="43" cy="22" r="18"/><circle cx="60" cy="32" r="13"/><rect x="25" y="32" width="35" height="14"/></g></svg>
  <h1 id="name"></h1>
  <small id="latin"></small>
  <p id="tagline"></p>
  <img id="cover" class="cover" alt="صورة المقهى" hidden>
  <div class="chips" id="chips"></div>
  <a class="btn" id="book">احجز طاولة</a>
</header>
<main>
  <div id="menu"></div>
  <div class="info" id="info"></div>
</main>
<footer id="footer"></footer>

<script>
/* ============================================================
   ✏️  بدلي غير هاد الجزء لكل مقهى. ما تمسيش ما تحت السطر ديال "المحرك".
   ============================================================ */
const CONFIG = {
  name: "كافي كلاود",
  latin: "CLOUD CAFÉ",
  tagline: "القهوة التي تحلق بك بعيداً.",
  whatsapp: "212770144817",            // الرقم بالصيغة الدولية، بلا + وبلا صفر
  hours: "كل يوم من 8:00 صباحا إلى 11:00 ليلا",
  address: "[ALALIA]",
  phone: "[رقم المحل]",
  map: "",                             // رابط Google Maps (اختياري)
  footer: "نموذج موقع من تصميم جميلة",
  colors: { main: "#16324f", soft: "#cfe3f5", accent: "#f2a65a" },
  services: ["قهوة وأتاي", "فطور", "واي فاي مجاني", "الطلبات للخارج", "جلسة خارجية"],
  // صورة المقهى: ارفعيها بسمية cafe-photo (بلا امتداد)
  // المنيو: [السمية، الثمن، سمية الصورة بلا امتداد]
  menu: [
    { t: "المشروبات الساخنة", i: [
      ["قهوة سوداء", "10 دراهم", "qahwa-kahla"],
      ["نص نص", "14 درهم", "nos-nos"],
      ["كابتشينو", "20 درهم", "cappuccino"],
      ["كلاود لاتيه", "25 درهم", "cloud-latte"],
      ["أتاي بالنعناع", "12 درهم", "atay"] ] },
    { t: "المشروبات الباردة", i: [
      ["عصير البرتقال", "15 درهم", "orange"],
      ["آيس لاتيه", "24 درهم", "iced-latte"],
      ["موهيتو", "22 درهم", "mojito"] ] },
    { t: "الحلويات", i: [
      ["كرواسون", "8 دراهم", "croissant"],
      ["كيك", "18 درهم", "cake"],
      ["بانكيك", "25 درهم", "pancake"] ] }
  ]
};

/* ============================================================
   ⚙️  المحرك: ما تمسيهش
   ============================================================ */
const $ = id => document.getElementById(id);
const C = CONFIG, rs = document.documentElement.style;
rs.setProperty("--navy", C.colors.main);
rs.setProperty("--sky", C.colors.soft);
rs.setProperty("--sun", C.colors.accent);
document.title = C.name;
$("name").textContent = C.name;
$("latin").textContent = C.latin;
$("tagline").textContent = C.tagline;
$("footer").textContent = C.footer;
$("book").href = "https://wa.me/" + C.whatsapp;
$("chips").innerHTML = C.services.map(x => "<span>" + x + "</span>").join("");
$("info").innerHTML = "<p><b>أوقات العمل:</b> " + C.hours + "</p><p><b>العنوان:</b> " + C.address +
  "</p><p><b>الهاتف:</b> " + C.phone + "</p>" + (C.map ? '<p><a href="' + C.map + '">الموقع على الخريطة</a></p>' : "");

// كيقلب على الصورة بأي امتداد
const EXTS = [".jpg", ".jpeg", ".png", ".webp", ".jfif", ".avif", ".jpg.jpg", ".jpg.jpeg", ".jpg.png", ".jpg.webp", ".jpg.jfif", ".jpg.avif"];
function loadImg(img, base, ok) {
  let k = 0;
  img.onload = () => ok && ok();
  img.onerror = () => { k++; if (k < EXTS.length) img.src = base + EXTS[k]; else img.remove(); };
  img.src = base + EXTS[0];
}
loadImg($("cover"), "cafe-photo", () => { $("cover").hidden = false; });

$("menu").innerHTML = C.menu.map(s =>
  "<h2>" + s.t + "</h2>" + s.i.map(([n, p, f]) =>
    '<div class="item"><div class="thumb"><img data-base="' + f + '" alt="' + n + '"></div><span>' +
    n + "</span><i></i><b>" + p + "</b></div>"
  ).join("")
).join("");
document.querySelectorAll(".thumb img").forEach(im => loadImg(im, im.dataset.base));
</script>
</body>
</html>
